name: Build mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.html"
      - "assets/**"
      - "mobile/**"
      - "mobile-assets/**"
      - "download.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: write

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          cp mobile/google-services.json android/app/google-services.json

      - name: Configure Android permissions and notification icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          camera='<uses-permission android:name="android.permission.CAMERA" />'
          if camera not in s:
              s=s.replace('<application', camera+'\n    <application', 1)
          meta='<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_cardiology" />'
          if meta not in s:
              start=s.find('<application')
              end=s.find('>', start)
              if start >= 0 and end >= 0:
                  s=s[:end+1]+'\n        '+meta+s[end+1:]
          p.write_text(s)

          drawable=Path('android/app/src/main/res/drawable/ic_stat_cardiology.xml')
          drawable.parent.mkdir(parents=True, exist_ok=True)
          drawable.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">\n    <path android:fillColor="#FFFFFFFF" android:pathData="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/>\n</vector>\n''')
          PY

      - name: Generate branded Android icon and splash assets
        run: npm run assets:android

      - name: Build unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk resident-training-android-unsigned.apk

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: resident-training-android-unsigned
          path: resident-training-android-unsigned.apk
          if-no-files-found: error

      - name: Sign production release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > resident-training-release.p12
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -v 4 resident-training-android-unsigned.apk resident-training-android-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks resident-training-release.p12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out resident-training-android.apk \
            resident-training-android-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs resident-training-android.apk

      - name: Upload signed release artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: resident-training-android-signed
          path: resident-training-android.apk
          if-no-files-found: error

      - name: Publish stable signed Android download
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view mobile-latest >/dev/null 2>&1; then
            gh release upload mobile-latest resident-training-android.apk --clobber
          else
            gh release create mobile-latest resident-training-android.apk \
              --target "$GITHUB_SHA" \
              --title "Resident Training Mobile" \
              --notes "Production-signed Android build for Resident Training & Assessment."
          fi

  ios-project:
    name: iOS native project
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Enable camera permission for meeting QR scanner
        run: plutil -replace NSCameraUsageDescription -string "Scan meeting attendance QR codes." ios/App/App/Info.plist

      - name: Generate branded iOS icon and splash assets
        run: npm run assets:ios

      - name: Package iOS source project
        run: zip -qry resident-training-ios-project.zip ios

      - name: Upload iOS project artifact
        uses: actions/upload-artifact@v4
        with:
          name: resident-training-ios-project
          path: resident-training-ios-project.zip
          if-no-files-found: error
