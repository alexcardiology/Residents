name: Build mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.html"
      - "assets/**"
      - "mobile/**"
      - "mobile-assets/**"
      - "download.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: write

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Enable camera permission for meeting QR scanner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          permission='<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in s:
              s=s.replace('<application', permission+'\n    <application', 1)
          p.write_text(s)
          PY

      - name: Generate branded Android icon and splash assets
        run: npm run assets:android

      - name: Build unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk resident-training-android-unsigned.apk

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: resident-training-android-unsigned
          path: resident-training-android-unsigned.apk
          if-no-files-found: error

      - name: Sign production release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > resident-training-release.p12
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -v 4 resident-training-android-unsigned.apk resident-training-android-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks resident-training-release.p12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out resident-training-android.apk \
            resident-training-android-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs resident-training-android.apk

      - name: Upload signed release artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: resident-training-android-signed
          path: resident-training-android.apk
          if-no-files-found: error

      - name: Publish stable signed Android download
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view mobile-latest >/dev/null 2>&1; then
            gh release upload mobile-latest resident-training-android.apk --clobber
          else
            gh release create mobile-latest resident-training-android.apk \
              --target "$GITHUB_SHA" \
              --title "Resident Training Mobile" \
              --notes "Production-signed Android build for Resident Training & Assessment."
          fi

  ios-project:
    name: iOS native project
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Create iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Enable camera permission for meeting QR scanner
        run: plutil -replace NSCameraUsageDescription -string "Scan meeting attendance QR codes." ios/App/App/Info.plist

      - name: Generate branded iOS icon and splash assets
        run: npm run assets:ios

      - name: Package iOS source project
        run: zip -qry resident-training-ios-project.zip ios

      - name: Upload iOS project artifact
        uses: actions/upload-artifact@v4
        with:
          name: resident-training-ios-project
          path: resident-training-ios-project.zip
          if-no-files-found: error
