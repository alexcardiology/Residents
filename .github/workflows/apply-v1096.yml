name: Apply v1.0.96 frontend patch

on:
  push:
    branches: [main]
    paths:
      - 'v1096.patch.ready'

permissions:
  contents: write

jobs:
  apply-v1096:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified v1.0.96 patch
        shell: bash
        run: |
          set -euo pipefail
          cat v1096.patch.part* > v1096.patch
          git apply --check v1096.patch
          git apply v1096.patch
          git rm v1096.patch.part* v1096.patch.ready .github/workflows/apply-v1096.yml
          rm -f v1096.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/style.css
          git commit -m "Deploy v1.0.96 participation-specific logbook requirements"
          git push
