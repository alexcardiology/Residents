name: Mobile drawer cards v1.0.98

on:
  push:
    paths:
      - '.deploy-v1098'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile header refresh and drawer card styling
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "v1.0.98 — Mobile refresh header + card-style drawer" assets/style.css; then
            echo '' | base64 -d >> assets/style.css
          fi
          git rm -f .deploy-v1098 .github/workflows/mobile-drawer-v1098.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/style.css
          git commit -m 'Style mobile drawer cards and refresh header v1.0.98'
          git push
