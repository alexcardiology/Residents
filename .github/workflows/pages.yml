name: Deploy Residents Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve active Supabase browser key
        env:
          SUPABASE_URL: https://dwkkhqmifmmxubtuaqbd.supabase.co
        run: |
          set -euo pipefail
          curl -fsS "$SUPABASE_URL/functions/v1/portal-key-diagnostic" -o /tmp/portal-key-diagnostic.json

          SUPABASE_KEY="$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/portal-key-diagnostic.json', encoding='utf-8'))
          key = str(data.get('anonKey') or '').strip()
          status = int((data.get('anonAuth') or {}).get('status') or 0)
          body = str((data.get('anonAuth') or {}).get('body') or '')
          if not key:
              raise SystemExit('Runtime anon key was not returned')
          if status not in (400, 422) or 'invalid_credentials' not in body:
              raise SystemExit(f'Runtime anon key failed Auth verification: HTTP {status} {body[:120]}')
          print(key)
          PY
          )"
          echo "::add-mask::$SUPABASE_KEY"

          SUPABASE_KEY="$SUPABASE_KEY" python3 - <<'PY'
          import os, re
          path = 'assets/supabase-v174.js'
          text = open(path, encoding='utf-8').read()
          key = os.environ['SUPABASE_KEY']
          text, count = re.subn(
              r"export const SUPABASE_LEGACY_ANON_KEY='[^']*';",
              "export const SUPABASE_LEGACY_ANON_KEY='" + key + "';",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not inject active runtime anon key into v174 client')
          open(path, 'w', encoding='utf-8').write(text)
          PY

          auth_status="$(curl -sS -o /tmp/auth-smoke.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"email":"auth-smoke-do-not-create@example.invalid","password":"not-a-real-password"}')"

          if [ "$auth_status" != "400" ] && [ "$auth_status" != "422" ]; then
            echo "Supabase Auth smoke test failed: HTTP $auth_status"
            cat /tmp/auth-smoke.json
            exit 1
          fi
          if ! grep -qi 'invalid_credentials' /tmp/auth-smoke.json; then
            echo "Supabase Auth smoke test did not return the expected invalid-credentials response"
            cat /tmp/auth-smoke.json
            exit 1
          fi
          echo "Supabase Auth browser-key smoke test passed."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
