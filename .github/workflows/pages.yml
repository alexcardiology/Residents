name: Deploy Residents Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify portal authentication gateway
        env:
          PROXY_URL: https://dwkkhqmifmmxubtuaqbd.supabase.co/functions/v1/portal-api-proxy?target=%2Fauth%2Fv1%2Ftoken%3Fgrant_type%3Dpassword
        run: |
          set -euo pipefail
          test -f assets/supabase-v175.js
          test -f assets/login-v175.js
          test -f index.html
          grep -F 'assets/login-v175.js?v=175' index.html >/dev/null
          grep -F 'portal-api-proxy' assets/supabase-v175.js >/dev/null

          status="$(curl -sS -o /tmp/proxy-auth-smoke.json -w '%{http_code}' \
            -X POST "$PROXY_URL" \
            -H 'Content-Type: application/json' \
            --data '{"email":"auth-smoke-do-not-create@example.invalid","password":"not-a-real-password"}')"

          if [ "$status" != "400" ] && [ "$status" != "422" ]; then
            echo "Portal authentication gateway failed: HTTP $status"
            cat /tmp/proxy-auth-smoke.json
            exit 1
          fi
          if ! grep -qi 'invalid_credentials' /tmp/proxy-auth-smoke.json; then
            echo "Portal authentication gateway did not reach Supabase Auth correctly"
            cat /tmp/proxy-auth-smoke.json
            exit 1
          fi
          echo "Portal authentication gateway smoke test passed."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
