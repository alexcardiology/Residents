name: Deploy Residents Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inspect Supabase runtime key health
        run: |
          curl -fsS "https://dwkkhqmifmmxubtuaqbd.supabase.co/functions/v1/portal-key-diagnostic" | tee /tmp/portal-key-diagnostic.json
          echo

      - name: Verify browser Supabase auth key
        env:
          SUPABASE_URL: https://dwkkhqmifmmxubtuaqbd.supabase.co
        run: |
          set -euo pipefail
          test -f assets/supabase-v174.js
          test -f assets/login-v174.js

          SUPABASE_KEY="$(python3 - <<'PY'
          import re
          text = open('assets/supabase-v174.js', encoding='utf-8').read()
          match = re.search(r"SUPABASE_LEGACY_ANON_KEY='([^']+)'", text)
          if not match:
              raise SystemExit('Browser key not found in v174 client')
          print(match.group(1))
          PY
          )"
          echo "::add-mask::$SUPABASE_KEY"

          auth_status="$(curl -sS -o /tmp/auth-smoke.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"email":"auth-smoke-do-not-create@example.invalid","password":"not-a-real-password"}')"

          if grep -qi 'invalid api key' /tmp/auth-smoke.json; then
            echo "Supabase Auth gateway rejected browser API key"
            cat /tmp/auth-smoke.json
            exit 1
          fi
          if [ "$auth_status" != "400" ] && [ "$auth_status" != "422" ]; then
            echo "Unexpected Auth response: HTTP $auth_status"
            cat /tmp/auth-smoke.json
            exit 1
          fi
          echo "Supabase Auth accepted the browser key and returned expected invalid-credentials status $auth_status."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
