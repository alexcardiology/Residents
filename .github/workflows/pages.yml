name: Deploy Residents Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify browser Supabase key
        env:
          SUPABASE_URL: https://dwkkhqmifmmxubtuaqbd.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3a2hxbWlmbW14dWJ0dWFxYmQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NTkyMzU0MSwiZXhwIjoyMTAxNDk5NTQxfQ.6_aryJx9eA_tKwqm6GjMbM4i9LG_z99qL-uDZaHlRJg
        run: |
          set -euo pipefail
          test -f assets/supabase-v174.js
          test -f assets/login-v174.js
          grep -F "$SUPABASE_KEY" assets/supabase-v174.js >/dev/null

          rest_status="$(curl -sS -o /tmp/rest-smoke.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/")"
          if [ "$rest_status" != "200" ]; then
            echo "Supabase REST gateway rejected browser key: HTTP $rest_status"
            cat /tmp/rest-smoke.json
            exit 1
          fi

          auth_status="$(curl -sS -o /tmp/auth-smoke.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"email":"auth-smoke-do-not-create@example.invalid","password":"not-a-real-password"}')"

          if [ "$auth_status" = "401" ]; then
            echo "Supabase Auth gateway rejected browser API key"
            cat /tmp/auth-smoke.json
            exit 1
          fi
          if [ "$auth_status" != "400" ] && [ "$auth_status" != "422" ]; then
            echo "Unexpected Auth response: HTTP $auth_status"
            cat /tmp/auth-smoke.json
            exit 1
          fi
          echo "Supabase browser key accepted by REST and Auth gateways (expected invalid-credentials status $auth_status)."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
