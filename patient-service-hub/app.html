<script>
const URL='https://dwkkhqmifmmxubtuaqbd.supabase.co',KEY='sb_publishable_5RESwwz-dpHp8Sv5eZ2qqQ_73VQF4lV';
const sb=supabase.createClient(URL,KEY),hub=document.getElementById('hub'),gate=document.getElementById('gate');
(async()=>{
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.replace('./login.html?v=5');return}
 hub.src='./v2.html?v=5';
 let tries=0;
 const watch=setInterval(()=>{
   tries++;
   try{
     const doc=hub.contentDocument;
     const app=doc&&doc.getElementById('app');
     if(app&&!app.classList.contains('hide')){
       clearInterval(watch);hub.classList.add('ready');gate.classList.add('out');setTimeout(()=>gate.remove(),260);return;
     }
     if(tries>80){clearInterval(watch);location.replace('./login.html?v=5')}
   }catch(e){if(tries>80){clearInterval(watch);location.replace('./login.html?v=5')}}
 },100);
})();
