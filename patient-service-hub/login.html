<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<title>Alexandria Cardiology Patient Service Hub</title>
<link rel="manifest" href="./manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--orange:#f45b0b;--orange-dark:#d94605;--peach:#fff7ed;--line:#f4b184;--ink:#28130b;--muted:#6e6d74;--card:#fff;--shadow:0 18px 50px rgba(123,55,20,.10)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 10%,#fffdf9 0,#fff8ef 44%,#fff2e6 100%);color:var(--ink);padding:44px 20px;display:grid;place-items:center}.login-card{width:min(1070px,100%);background:rgba(255,255,255,.96);border:1.5px solid #f2b98f;border-radius:34px;padding:48px 72px 56px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:26px;margin-bottom:42px}.logo{width:170px;height:132px;display:grid;place-items:center;flex:0 0 auto}.brand-copy strong{font-size:47px;line-height:1.02;letter-spacing:-1.6px}.brand-copy span{display:block;color:var(--orange);font-size:31px;margin-top:8px}.login-card h1{font-size:60px;line-height:1;margin:0 0 30px;letter-spacing:-2.4px}.subtitle{font-size:28px;font-weight:600;color:#6c6b72;margin:0 0 46px}.field{margin:0 0 28px}.field label{display:block;font-weight:850;font-size:23px;margin-bottom:13px}.input-shell{height:102px;border:1.7px solid #f3b283;border-radius:20px;background:#fffdfa;display:flex;align-items:center;padding:0 24px;transition:.2s}.input-shell:focus-within{border:2px solid var(--orange);box-shadow:0 0 0 5px rgba(244,91,11,.12)}.input-shell input{border:0!important;outline:0!important;background:transparent!important;width:100%;height:100%;font-size:28px;font-weight:600;color:#111;min-width:0}.input-icon{width:42px;height:42px;color:var(--orange);display:grid;place-items:center;flex:0 0 auto;margin-inline-start:18px}.eye{border:0;background:transparent;cursor:pointer;color:#3b160c;padding:5px;width:50px;height:50px;display:grid;place-items:center;flex:0 0 auto}.eye:hover{color:var(--orange)}.forgot-row{display:flex;justify-content:space-between;align-items:center;margin:-4px 3px 36px;gap:20px}.forgot{border:0;background:none;padding:0;color:#ef4e08;font-size:22px;text-decoration:underline;cursor:pointer}.forgot.ar{direction:rtl}.sign-btn{width:100%;height:88px;border:0;border-radius:19px;background:linear-gradient(100deg,var(--orange-dark),#ff6814);color:#fff;font-size:31px;font-weight:850;cursor:pointer;box-shadow:0 9px 22px rgba(230,78,5,.16)}.sign-btn:disabled{opacity:.65;cursor:wait}.divider{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin:38px 4px 31px;color:#64646a;font-size:23px;font-weight:700}.divider:before,.divider:after{content:"";height:1.5px;background:#f1c3a5}.lang-btn{width:100%;height:82px;border:1.7px solid #f3a56f;border-radius:18px;background:#fff;color:#e94f08;font-size:25px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px}.message{min-height:25px;margin-top:20px;text-align:center;font-size:17px;font-weight:650}.error{color:#b91c1c}.success{color:#15803d}[dir=rtl] .brand,[dir=rtl] .forgot-row{direction:rtl}[dir=rtl] .brand-copy{text-align:right}[dir=rtl] .field label{text-align:right}[dir=rtl] .login-card h1,[dir=rtl] .subtitle{text-align:right}
@media(max-width:850px){body{padding:18px 12px}.login-card{padding:30px 28px 38px;border-radius:26px}.brand{gap:16px;margin-bottom:32px}.logo{width:110px;height:90px}.brand-copy strong{font-size:30px}.brand-copy span{font-size:21px}.login-card h1{font-size:45px}.subtitle{font-size:21px;margin-bottom:34px}.field label{font-size:18px}.input-shell{height:76px}.input-shell input{font-size:20px}.forgot{font-size:17px}.sign-btn{height:70px;font-size:24px}.lang-btn{height:66px;font-size:21px}.divider{font-size:19px;margin:28px 4px 22px}}
@media(max-width:560px){.login-card{padding:26px 19px 31px}.brand{align-items:center}.logo{width:78px;height:68px}.brand-copy strong{font-size:23px;letter-spacing:-.6px}.brand-copy span{font-size:17px;margin-top:4px}.login-card h1{font-size:36px;letter-spacing:-1.3px;margin-bottom:20px}.subtitle{font-size:18px}.input-shell{height:64px;border-radius:15px;padding:0 15px}.input-shell input{font-size:17px}.field{margin-bottom:22px}.forgot-row{margin-bottom:28px}.forgot{font-size:14px}.sign-btn{height:60px;font-size:21px;border-radius:15px}.divider{font-size:16px;gap:13px}.lang-btn{height:58px;font-size:18px;border-radius:15px}}
</style>
</head>
<body>
<main class="login-card" aria-label="Alexandria Cardiology Patient Service Hub sign in">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 180 145" width="100%" height="100%" fill="none">
        <defs><clipPath id="heartClip"><path d="M86 132C48 101 21 77 21 44C21 19 49 7 68 25C77 33 83 40 86 47C89 40 95 33 104 25C123 7 151 19 151 44C151 77 124 101 86 132Z"/></clipPath></defs>
        <path d="M86 132C48 101 21 77 21 44C21 19 49 7 68 25C77 33 83 40 86 47C89 40 95 33 104 25C123 7 151 19 151 44C151 77 124 101 86 132Z" fill="#f45b0b" stroke="#f45b0b" stroke-width="3"/>
        <rect x="86" y="0" width="94" height="145" fill="#fff" clip-path="url(#heartClip)"/>
        <path d="M86 132C48 101 21 77 21 44C21 19 49 7 68 25C77 33 83 40 86 47C89 40 95 33 104 25C123 7 151 19 151 44C151 77 124 101 86 132Z" stroke="#3f170f" stroke-width="3"/>
        <path d="M30 72h26l7-30 12 61 11-36h18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M110 31c0 16 2 28 12 39m-15-21c-4 17-2 33 10 48m5-26c11 5 18 14 18 28m-27-13c-11 7-17 17-15 32m26-34c-5 9-6 18-2 29m-10-46c-12 2-22 10-27 22m39-48c-7 0-12-4-14-11" stroke="#d64c10" stroke-width="3.3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-copy"><strong data-en="Alexandria Cardiology" data-ar="قلب الإسكندرية">Alexandria Cardiology</strong><span data-en="Patient Service Hub" data-ar="مركز خدمات المرضى">Patient Service Hub</span></div>
  </div>
  <h1 data-en="Staff sign in" data-ar="تسجيل دخول الموظفين">Staff sign in</h1>
  <p class="subtitle" data-en="Authorized department staff only" data-ar="للعاملين المصرح لهم بالقسم فقط">Authorized department staff only</p>
  <form id="loginForm">
    <div class="field"><label for="email" data-en="Email" data-ar="البريد الإلكتروني">Email</label><div class="input-shell"><input id="email" type="email" autocomplete="username" value="drmohamedalaa90@gmail.com" required><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="31" height="31" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span></div></div>
    <div class="field"><label for="password" data-en="Password" data-ar="كلمة المرور">Password</label><div class="input-shell"><input id="password" type="password" autocomplete="current-password" required><button id="eyeBtn" class="eye" type="button" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div>
    <div class="forgot-row"><button type="button" class="forgot" id="forgotEn">Forgot password?</button><button type="button" class="forgot ar" id="forgotAr">نسيت كلمة المرور؟</button></div>
    <button id="signBtn" class="sign-btn" type="submit"><span aria-hidden="true">↪</span>&nbsp; <span data-en="Sign in" data-ar="تسجيل الدخول">Sign in</span></button>
  </form>
  <div class="divider"><span data-en="or" data-ar="أو">or</span></div>
  <button id="langBtn" class="lang-btn" type="button"><span aria-hidden="true">◎</span><span id="langLabel">العربية</span></button>
  <div id="message" class="message" aria-live="polite"></div>
</main>
<script>
const SB_URL='https://dwkkhqmifmmxubtuaqbd.supabase.co';
const SB_KEY='sb_publishable_5RESwwz-dpHp8Sv5eZ2qqQ_73VQF4lV';
const sb=supabase.createClient(SB_URL,SB_KEY);let lang='en';
function setLang(next){lang=next;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-en][data-ar]').forEach(el=>el.textContent=el.dataset[lang]);document.getElementById('langLabel').textContent=lang==='en'?'العربية':'English'}
function msg(text,type='error'){const el=document.getElementById('message');el.textContent=text;el.className='message '+type}
document.getElementById('langBtn').addEventListener('click',()=>setLang(lang==='en'?'ar':'en'));
document.getElementById('eyeBtn').addEventListener('click',()=>{const p=document.getElementById('password');const showing=p.type==='text';p.type=showing?'password':'text';const label=showing?'Show password':'Hide password';eyeBtn.setAttribute('aria-label',label);eyeBtn.title=label});
async function forgot(){const email=document.getElementById('email').value.trim();if(!email)return msg(lang==='ar'?'أدخل البريد الإلكتروني أولاً':'Enter your email first.');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace('login.html','app.html?v=5')});if(error)return msg(error.message);msg(lang==='ar'?'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.':'Password reset link sent to your email.','success')}
document.getElementById('forgotEn').addEventListener('click',forgot);document.getElementById('forgotAr').addEventListener('click',forgot);
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('','');const btn=document.getElementById('signBtn');btn.disabled=true;const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});btn.disabled=false;if(error)return msg(error.message);const {data:staff,error:staffErr}=await sb.from('psh_staff').select('active').eq('user_id',data.user.id).maybeSingle();if(staffErr||!staff?.active){await sb.auth.signOut();return msg(lang==='ar'?'هذا الحساب غير مصرح له بدخول مركز خدمات المرضى.':'This account does not have active Patient Hub access.')}location.replace('./app.html?v=5')});
setLang('en');
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update())).catch(()=>{})}
</script>
</body></html>
