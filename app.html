      [hidden] { display: none !important; }
      #mobileHeaderIdentity { display: none; }
      @media (max-width: 850px) {
        #mobileHeaderIdentity { display:flex;min-width:0;max-width:min(48vw,230px);margin-left:auto;flex-direction:column;align-items:flex-end;justify-content:center;text-align:right;line-height:1.08; }

        #mobileHeaderIdentity small { display:block;max-width:100%;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.65rem;font-weight:650;text-transform:none;letter-spacing:0; }

    <script type="module">
      import { sb } from "./assets/supabase.js";
      const identity=document.querySelector("#mobileHeaderIdentity"),profileChip=document.querySelector("#profileChip");let username="",fallbackName="";
      const paintMobileIdentity=()=>{if(!identity)return;const chipName=profileChip?.querySelector("span:last-child")?.textContent?.trim(),displayName=chipName||fallbackName||username||"Signed in";identity.replaceChildren();const nameNode=document.createElement("strong"),userNode=document.createElement("small");nameNode.textContent=displayName;userNode.textContent=username?`@${username.replace(/^@/,"")}`:"";identity.append(nameNode,userNode)};
      try{const{data:sessionData}=await sb.auth.getSession(),userId=sessionData?.session?.user?.id;if(userId){const{data:profile}=await sb.from("profiles").select("display_name,username").eq("id",userId).single();username=String(profile?.username||"").trim();fallbackName=String(profile?.display_name||profile?.username||"").trim()}}catch(_){}
      paintMobileIdentity();if(profileChip)new MutationObserver(paintMobileIdentity).observe(profileChip,{childList:true,subtree:true,characterData:true});setTimeout(paintMobileIdentity,250);setTimeout(paintMobileIdentity,900);
    </script>
