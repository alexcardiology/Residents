      const identity=document.querySelector("#mobileHeaderIdentity"),profileChip=document.querySelector("#profileChip");let username="",fallbackName="";const paintMobileIdentity=()=>{if(!identity)return;const chipName=profileChip?.querySelector("span:last-child")?.textContent?.trim(),displayName=chipName||fallbackName||username||"Signed in";identity.replaceChildren();const nameNode=document.createElement("strong"),userNode=document.createElement("small");nameNode.textContent=displayName;userNode.textContent=username?`@${username.replace(/^@/,"")}`:"";identity.append(nameNode,userNode)};try{const{data:sessionData}=await sb.auth.getSession(),userId=sessionData?.session?.user?.id;if(userId){const{data:profile}=await sb.from("profiles").select("display_name,username").eq("id",userId).single();username=String(profile?.username||"").trim();fallbackName=String(profile?.display_name||profile?.username||"").trim()}}catch(_){}paintMobileIdentity();if(profileChip)new MutationObserver(paintMobileIdentity).observe(profileChip,{childList:true,subtree:true,characterData:true});setTimeout(paintMobileIdentity,250);setTimeout(paintMobileIdentity,900);
