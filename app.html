<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081c35" />
    <title>Training Portal</title>
    <link rel="stylesheet" href="assets/style.css?v=1.0.57" />
    <style>
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">♥<span>Preparing your portal…</span></div>
    <div id="shell" class="shell" hidden>
      <aside>
        <a class="brand light"
          ><b>♥</b
          ><span
            ><strong>Cardiology</strong
            ><small>Training & Assessment</small></span
          ></a
        ><button id="userCard" class="user-card"></button>
        <nav id="nav"></nav>
        <button id="logout">↪ Log out</button>
      </aside>
      <div id="backdrop"></div>
      <section class="workspace">
        <header>
          <button id="menu">☰</button>
          <div>
            <small id="crumb"></small>
            <h1 id="title">Dashboard</h1>
          </div>
          <button id="profileChip"></button>
        </header>
        <main id="content"></main>
      </section>
    </div>
    <dialog id="modal"><div id="modalBody"></div></dialog>
    <div id="toast"></div>
    <script type="module" src="assets/app.js?v=1.0.57"></script>
  </body>
</html>
