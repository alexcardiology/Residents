<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081c35" />
    <title>Training Portal</title>
    <link rel="stylesheet" href="assets/style.css?v=1.0.98" />
    <link rel="stylesheet" href="assets/el-medico-contact-actions.css?v=1.0.100" />
    <link rel="stylesheet" href="assets/profile-schedule-name.css?v=1.0.101" />
    <link rel="stylesheet" href="assets/el-medico-quick-prompts.css?v=1.0.105" />
    <link rel="stylesheet" href="assets/account-switcher.css?v=1.0.110" />
    <link rel="stylesheet" href="assets/admin-red-theme.css?v=1.0.112" />
    <link rel="stylesheet" href="assets/minimum-requirements-year-tabs.css?v=1.0.114" />
    <script type="module" src="assets/admin-red-theme.js?v=1.0.112"></script>
    <style>
      [hidden] {
        display: none !important;
      }

      #mobileHeaderIdentity {
        display: none;
      }

      @media (max-width: 850px) {
        #mobileHeaderIdentity {
          display: flex;
          min-width: 0;
          max-width: min(48vw, 230px);
          margin-left: auto;
          flex-direction: column;
          align-items: flex-end;
          justify-content: center;
          text-align: right;
          line-height: 1.08;
        }

        #mobileHeaderIdentity strong {
          display: block;
          max-width: 100%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          color: var(--navy);
          font-size: .86rem;
          font-weight: 800;
        }

        #mobileHeaderIdentity small {
          display: block;
          max-width: 100%;
          margin-top: 3px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          color: var(--muted);
          font-size: .65rem;
          font-weight: 650;
          text-transform: none;
          letter-spacing: 0;
        }

        #mobileHeaderRefresh {
          margin-left: 8px !important;
          flex: 0 0 42px;
        }
      }

      @media (max-width: 390px) {
        #mobileHeaderIdentity {
          max-width: 43vw;
        }
        #mobileHeaderIdentity strong {
          font-size: .79rem;
        }
        #mobileHeaderIdentity small {
          font-size: .61rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">♥<span>Preparing your portal…</span></div>
    <div id="shell" class="shell" hidden>
      <aside>
        <button id="drawerClose" class="drawer-close" type="button" aria-label="Close navigation menu" title="Close menu">
          <span></span><span></span><span></span>
        </button>
        <a class="brand light"
          ><b>♥</b
          ><span
            ><strong>Cardiology</strong
            ><small>Training & Assessment</small></span
          ></a
        ><button id="userCard" class="user-card"></button>
        <nav id="nav"></nav>
        <button id="logout">↪ Log out</button>
      </aside>
      <div id="backdrop"></div>
      <section class="workspace">
        <header>
          <button id="menu">☰</button>
          <div>
            <small id="crumb"></small>
            <h1 id="title">Dashboard</h1>
          </div>
          <button id="profileChip"></button>
          <div id="mobileHeaderIdentity" aria-label="Signed in user"></div>
          <button id="accountSwitchButton" type="button" hidden aria-label="Switch account" title="Switch account">
            <span class="account-switch-button-icon" aria-hidden="true">⇄</span>
            <span class="account-switch-button-text">Switch account</span>
          </button>
          <button id="mobileHeaderRefresh" type="button" aria-label="Refresh page" title="Refresh" onclick="location.reload()">↻</button>
        </header>
        <main id="content"></main>
      </section>
    </div>
    <dialog id="modal"><div id="modalBody"></div></dialog>
    <div id="toast"></div>
    <script type="module" src="assets/app.js?v=1.0.96"></script>
    <script type="module" src="assets/minimum-requirements-ui.js?v=1.0.114"></script>
    <script type="module" src="assets/el-medico-contact-actions.js?v=1.0.110"></script>
    <script type="module" src="assets/profile-schedule-name.js?v=1.0.104"></script>
    <script type="module" src="assets/el-medico-quick-prompts.js?v=1.0.106"></script>
    <script type="module" src="assets/account-switcher.js?v=1.0.110"></script>
    <script src="assets/duty-bot-display-format.js?v=1.0.110"></script>
    <script type="module">
      import { sb } from "./assets/supabase.js";

      const identity = document.querySelector("#mobileHeaderIdentity");
      const profileChip = document.querySelector("#profileChip");
      let username = "";
      let fallbackName = "";

      const paintMobileIdentity = () => {
        if (!identity) return;
        const chipName = profileChip?.querySelector("span:last-child")?.textContent?.trim();
        const displayName = chipName || fallbackName || username || "Signed in";
        identity.replaceChildren();
        const nameNode = document.createElement("strong");
        const userNode = document.createElement("small");
        nameNode.textContent = displayName;
        userNode.textContent = username ? `@${username.replace(/^@/, "")}` : "";
        identity.append(nameNode, userNode);
      };

      try {
        const { data: sessionData } = await sb.auth.getSession();
        const userId = sessionData?.session?.user?.id;
        if (userId) {
          const { data: profile } = await sb
            .from("profiles")
            .select("display_name,username")
            .eq("id", userId)
            .single();
          username = String(profile?.username || "").trim();
          fallbackName = String(profile?.display_name || profile?.username || "").trim();
        }
      } catch (_) {}

      paintMobileIdentity();
      if (profileChip) {
        new MutationObserver(paintMobileIdentity).observe(profileChip, {
          childList: true,
          subtree: true,
          characterData: true,
        });
      }
      setTimeout(paintMobileIdentity, 250);
      setTimeout(paintMobileIdentity, 900);
    </script>
  </body>
</html>
