<!doctype html>
<html lang="en">
<head>

    h1{margin:0 0 10px;font-size:29px}p{margin:0;color:#607086;line-height:1.65}a{display:inline-block;margin-top:22px;padding:13px 20px;border-radius:14px;background:#0b6abf;color:#fff;text-decoration:none;font-weight:800}
  </style>

  <main>
    <div class="heart">♥</div>
